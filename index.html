<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Touchdown</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10251c;
      color: white;
      font-family: monospace;
      text-align: center;
    }
    main { padding: 24px; }
    h1 {
      font-size: clamp(32px, 8vw, 64px);
      color: #ffcf56;
    }
    p { font-size: 18px; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 16px 24px;
      border: 4px solid #ffcf56;
    }
  </style>
</head>
<body>
  <main>
    <h1>TINY TOUCHDOWN</h1>
    <p>32 teams. 17 games. One championship.</p>
    <div class="badge">Game in development</div>
  </main>
</body>
</html>
